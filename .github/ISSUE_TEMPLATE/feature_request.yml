name: Feature request
description: Propose a read-only XTrawl capability or improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What read-only collection or developer problem should XTrawl solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, CLI, documentation, or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is read-only and does not post, like, follow, message, or change an account.
          required: true
        - label: This request does not require storing or exposing raw credentials.
          required: true
